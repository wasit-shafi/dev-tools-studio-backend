name: CD_PIPELINE

on:
  workflow_run:
    workflows: ['CI_PIPELINE']
    types:
      - completed

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Pull latest image from DockerHub
        run: sudo docker pull wasitshafi700/dev-tools-studio:latest

      - name: Remove/Delete existing docker container
        run: sudo docker rm -f wasitshafi700/dev-tools-studio # -f: Remove even if container is running

      - name: Run docker container
        run: docker-compose -f docker-compose.prod.yml up --build -V
